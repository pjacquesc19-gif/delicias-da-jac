name: Atualizar catálogo (planilha para JSON)

# Roda só quando a planilha (ou o conversor) muda. O commit feito pelo próprio
# workflow altera apenas data/produtos.json, que NÃO está na lista abaixo,
# então ele nunca dispara a si mesmo. Commits feitos com o GITHUB_TOKEN também
# não disparam novos workflows, e a mensagem leva [skip ci] por garantia.
on:
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-catalogo
  cancel-in-progress: false

jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Valida a planilha e gera data/produtos.json. Se houver erro na planilha,
      # o job falha (X vermelho na aba Actions) e o JSON publicado não muda.
      - name: Converter planilha em JSON
        run: python scripts/xlsx_to_json.py

      - name: Salvar JSON atualizado no repositório
        run: |
          if [ -z "$(git status --porcelain data/produtos.json)" ]; then
            echo "data/produtos.json já está em dia. Nada a salvar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/produtos.json
          git commit -m "chore: atualizar data/produtos.json a partir da planilha [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
